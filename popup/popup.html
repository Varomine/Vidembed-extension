<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidEmbed PRO - Stream Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
          <path d="M10 9.5l3.5 2.5-3.5 2.5v-5z" fill="currentColor"></path>
        </svg>
      </div>
      <div class="brand-title">
        <h1>VidEmbed</h1>
        <span class="badge-tag">PRO</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="btnBatch" class="icon-btn" title="Batch Download Video URLs">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="8" rx="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
      </button>
      <button id="btnRefresh" class="icon-btn" title="Refresh Media List">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
      </button>
      <button id="btnOptions" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search detected media...">
    </div>
    <button id="btnClear" class="btn-sm btn-text">Clear</button>
  </div>

  <!-- Status Bar & Filter -->
  <div class="status-bar">
    <span id="detectedCount">0 media streams detected</span>
    <label class="filter-toggle">
      <input type="checkbox" id="chkHideTS" checked>
      <span>Hide .TS Chunks</span>
    </label>
  </div>

  <!-- Media Container -->
  <main id="mediaContainer" class="media-container">
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </div>
      <h3>No media detected yet</h3>
      <p>Play a video on the page or click Batch Download to enter URLs.</p>
    </div>
  </main>

  <!-- Modal Preview -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="previewTitle">Video Preview</h4>
        <div class="modal-options">
          <label class="toggle-pill">
            <input type="checkbox" id="chkUseProxy">
            <span>Proxy</span>
          </label>
          <label class="toggle-pill">
            <input type="checkbox" id="chkUseSandbox">
            <span>Sandbox</span>
          </label>
          <button id="btnClosePreview" class="close-btn">&times;</button>
        </div>
      </div>
      <div class="video-wrapper">
        <video id="previewVideo" controls class="hidden"></video>
        <iframe id="previewIframe" class="hidden"></iframe>
      </div>
    </div>
  </div>

  <script src="../lib/hls.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
