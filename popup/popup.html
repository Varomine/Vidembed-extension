<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidEmbed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Extension Header -->
  <header class="app-header">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
          <path d="M10 9.5l3.5 2.5-3.5 2.5v-5z" fill="currentColor"></path>
        </svg>
      </div>
      <div class="brand-title">
        <h1>VidEmbed</h1>
        <span class="badge-tag">Pro</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="btnRefresh" class="icon-btn" title="Refresh & Rescan Page">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
      </button>
      <button id="btnOptions" class="icon-btn" title="Extension Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Search & Filter Controls -->
  <div class="controls-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search detected media...">
    </div>
    <button id="btnClear" class="btn-sm btn-text" title="Clear detected list">Clear</button>
  </div>

  <!-- Status Bar & TS Segment Filter -->
  <div class="status-bar">
    <span id="detectedCount">Scanning media...</span>
    <label class="filter-toggle" title="Hide individual .ts segment chunks from list">
      <input type="checkbox" id="chkHideTS" checked>
      <span>Hide .TS Chunks</span>
    </label>
  </div>

  <!-- Media List Container -->
  <main id="mediaContainer" class="media-container">
    <!-- Media items populated dynamically -->
  </main>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state hidden">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        <line x1="1" y1="1" x2="23" y2="23" stroke="#ef4444" stroke-width="2"></line>
      </svg>
    </div>
    <h3>No media detected yet</h3>
    <p>Play a video on the active page or refresh the tab to detect video streams.</p>
  </div>

  <!-- Preview Modal with Proxy & Sandbox Toggles -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h4 id="previewTitle">Video Preview</h4>
        <div class="modal-options">
          <label class="toggle-pill" title="Route preview URL through http://streamrelay.sapis.workers.dev/proxy?url=...">
            <input type="checkbox" id="chkUseProxy">
            <span>Use Proxy</span>
          </label>
          <label class="toggle-pill" title="Render embed in sandboxed iframe (allow-same-origin allow-scripts)">
            <input type="checkbox" id="chkUseSandbox">
            <span>Use Sandbox</span>
          </label>
        </div>
        <button id="btnClosePreview" class="close-btn">&times;</button>
      </div>
      <div class="video-wrapper">
        <video id="previewVideo" controls autoplay crossorigin="anonymous"></video>
        <iframe id="previewIframe" class="hidden" frameborder="0" allowfullscreen sandbox="allow-same-origin allow-scripts"></iframe>
      </div>
    </div>
  </div>

  <script src="../lib/hls.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
