<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidEmbed - Batch Video Downloader</title>
  <link rel="stylesheet" href="batch.css">
</head>
<body>
  <div class="batch-app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
            <path d="M10 9.5l3.5 2.5-3.5 2.5v-5z" fill="currentColor"></path>
          </svg>
        </div>
        <div>
          <h2>VidEmbed Batch Downloader</h2>
          <span class="sub-heading">Auto-Generate Episode Links & Batch Download MP4s</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnStartBatch" class="btn btn-primary" disabled>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Start Batch Download (.MP4)
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="batch-workspace">
      <!-- Target Video Element & URL Range Generator Card -->
      <section class="card status-card">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <h3 style="font-size: 14px; font-weight: 700; color: #fff;">1. Target Video Player & Episode Generator</h3>
          
          <!-- Target Element Selector -->
          <div style="display: flex; gap: 10px; align-items: flex-end;">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Target Video Container / iFrame Selector</label>
              <input type="text" id="inputVideoSelector" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none;" placeholder="e.g. iframe, video, #player, .player-container" value="iframe, video, #player, .player-wrapper">
            </div>
            <button id="btnPickElement" class="btn btn-secondary" style="height: 35px;" title="Point and click on web page to select exact video player container">
              🎯 Pick Video Element
            </button>
          </div>

          <!-- URL Range Generator -->
          <div class="generator-grid" style="margin-top: 6px;">
            <div style="flex: 2; display: flex; flex-direction: column; gap: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">URL Pattern (use ${page})</label>
              <input type="text" id="inputUrlPattern" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none;" placeholder="e.g. https://www.mioz-anime.com/episode/higurashi-no-naku-koro-ni-kai-ep-${page}">
            </div>

            <div style="flex: 0.5; display: flex; flex-direction: column; gap: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">First Ep</label>
              <input type="number" id="inputStartPage" value="1" min="1" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none;">
            </div>

            <div style="flex: 0.5; display: flex; flex-direction: column; gap: 4px;">
              <label style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Last Ep</label>
              <input type="number" id="inputEndPage" value="24" min="1" style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none;">
            </div>

            <div style="display: flex; align-items: flex-end;">
              <button id="btnGenerateLinks" class="btn btn-secondary" style="height: 35px;">
                ⚡ Generate URLs
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Input URL Box Card -->
      <section class="card status-card">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 14px; font-weight: 700; color: #fff;">Episode URLs List</h3>
            <span id="txtUrlCount" style="font-size: 12px; color: #94a3b8;">0 URLs entered</span>
          </div>

          <textarea id="urlInputText" rows="6" style="width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #f8fafc; font-family: monospace; font-size: 12px; outline: none;" placeholder="Generated or pasted episode URLs will appear here..."></textarea>
          
          <div style="display: flex; justify-content: flex-end;">
            <button id="btnDetectStreams" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              Auto-Detect Targeted Video Streams
            </button>
          </div>
        </div>
      </section>

      <!-- Episode List Table -->
      <section class="card table-card">
        <div class="table-header">
          <div class="flex-between">
            <div class="left-controls">
              <label class="checkbox-label">
                <input type="checkbox" id="chkSelectAll" checked>
                <span>Select All Detected Videos</span>
              </label>
            </div>
            <div class="right-controls">
              <span id="pillReadyCount" class="pill pill-success">0 Ready</span>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="batch-table">
            <thead>
              <tr>
                <th width="40"><input type="checkbox" id="chkHeaderCheck" checked></th>
                <th>Episode / Video Name</th>
                <th>Source Page URL</th>
                <th>Stream Format</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="episodesTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../lib/hls_parser.js"></script>
  <script src="../lib/dash_parser.js"></script>
  <script src="../lib/mp4_stitcher.js"></script>
  <script src="batch.js"></script>
</body>
</html>
